services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savon
      POSTGRES_PASSWORD: savon
      POSTGRES_DB: mon_cher_savon
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U savon']
      interval: 5s
      retries: 10
volumes:
  pgdata:
